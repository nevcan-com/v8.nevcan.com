<html lang="en">
<head>

       instant refresh plus a canonical link tells search engines the page has moved for good. -->

  <link rel="canonical" href="https://dive.nevcan.com/booking">
  <meta http-equiv="refresh" content="0; url=https://dive.nevcan.com/booking">
  <script>location.replace('https://dive.nevcan.com/booking');</script>
</head>
<body>
  <p>The calendar has moved to <a href="https://dive.nevcan.com/booking">dive.nevcan.com/booking</a>.</p>
</body>
</html>
