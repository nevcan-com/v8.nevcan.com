# Monthly update proposals as pull requests: the pinned GitHub Actions (SHA + version comment) and
# npm packages. Security fixes come separately, as soon as an advisory is published, once
# "Dependabot security updates" is on in the repository settings.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # one pull request for all of them: upload- and deploy-pages must move together
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      dependencies:
        patterns: ['*']
    ignore:
      # @astrojs/check (astro check, part of the build) supports TypeScript 5 and 6 only;
      # drop this once it accepts 7
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
